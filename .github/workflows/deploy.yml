name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, develop ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full git history for commit info

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate build info
      run: |
        echo "REACT_APP_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
        echo "REACT_APP_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "REACT_APP_BRANCH=${{ github.ref_name }}" >> $GITHUB_ENV
        echo "REACT_APP_BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

    - name: Build
      run: npm run build
      env:
        REACT_APP_OPENAI_API_KEY: ${{ secrets.REACT_APP_OPENAI_API_KEY }}
        REACT_APP_BUILD_TIME: ${{ env.REACT_APP_BUILD_TIME }}
        REACT_APP_COMMIT_HASH: ${{ env.REACT_APP_COMMIT_HASH }}
        REACT_APP_BRANCH: ${{ env.REACT_APP_BRANCH }}
        REACT_APP_BUILD_NUMBER: ${{ env.REACT_APP_BUILD_NUMBER }}

    - name: Setup Pages
      uses: actions/configure-pages@v3

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: './build'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2